name: Build debug APK

on:
  push:
    branches:
      - "claude/**"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Ensure required Android SDK packages
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "No sdkmanager at $SDKMANAGER, searching under \$ANDROID_HOME/cmdline-tools..."
            FOUND=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort -V | tail -n1)
            if [ -n "$FOUND" ]; then
              SDKMANAGER="$FOUND"
            elif command -v sdkmanager >/dev/null 2>&1; then
              SDKMANAGER="$(command -v sdkmanager)"
            else
              echo "Could not locate sdkmanager anywhere" >&2
              exit 1
            fi
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.whisper-model-cache
          key: whisper-model-base

      - name: Cache sherpa-onnx native library and diarization models
        uses: actions/cache@v4
        with:
          path: ~/.sherpa-onnx-cache
          key: sherpa-onnx-1.12.14-diarization

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk voice-choicer-debug.apk

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: voice-choicer-debug-apk
          path: voice-choicer-debug.apk
          retention-days: 30

      - name: Publish/update "latest debug build" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-build
          name: "Voice Choicer – najnowszy build (debug)"
          body: |
            Automatycznie budowany plik APK (wersja debug, do testów) z brancha `${{ github.ref_name }}`, commit ${{ github.sha }}.

            Zainstaluj na telefonie: pobierz `voice-choicer-debug.apk` poniżej, otwórz plik na telefonie i zainstaluj (może być potrzebne zezwolenie na instalację z nieznanych źródeł).
          prerelease: true
          files: voice-choicer-debug.apk
